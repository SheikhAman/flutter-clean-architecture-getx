name: flutter_core
description: Master Flutter API boilerplate — custom widgets, auth OTP, Dio networking, showcase gallery.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.9.2
  flutter_screenutil: ^5.9.3
  get_storage: ^2.1.1
  connectivity_plus: ^7.1.1
  geolocator: ^14.0.2
  device_info_plus: ^11.3.3
  shimmer: ^3.0.0
  flutter_easyloading: ^3.0.5
  webview_flutter: ^4.13.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  pin_code_fields: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
